<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Régie BINGO DRAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f020a;
      --panel: #1e0515;
      --ruby: #d9044b;
      --gold: #f5c042;
      --border: rgba(245, 192, 66, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: 2px;
    }

    .controls-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Section YouTube */
    .yt-section {
      background: #14020e;
      border: 1px dashed rgba(245, 192, 66, 0.4);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .yt-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yt-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .yt-input {
      flex: 1;
      min-width: 250px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #000;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
    }

    .btn-yt {
      padding: 12px 20px;
      font-size: 0.95rem;
      background: #3a1c28;
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    .btn-yt.active {
      background: linear-gradient(135deg, #097931, #0c9e40);
      color: #fff;
      border-color: #72ff99;
      box-shadow: 0 0 12px rgba(12, 158, 64, 0.5);
    }

    /* Tirage classique */
    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="number"] {
      flex: 1;
      font-size: 2rem;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 10px;
      border: 2px solid var(--gold);
      background: #000;
      color: #fff;
      text-align: center;
    }

    button {
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      border-radius: 10px;
      border: none;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-submit {
      padding: 14px 28px;
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--gold), #c9880e);
      color: #120005;
    }

    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-undo {
      background: #3a1c28;
      border: 1px solid #ff5983;
      color: #ff9cb6;
      padding: 16px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .btn-bingo {
      background: linear-gradient(135deg, var(--ruby), #96002f);
      color: #fff;
      font-size: 1.4rem;
      letter-spacing: 3px;
      padding: 18px;
      box-shadow: 0 0 20px rgba(217, 4, 75, 0.4);
    }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #999;
      padding: 12px;
      font-size: 0.85rem;
    }

    .btn-reset:hover {
      border-color: #f00;
      color: #f00;
    }

    .grid-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .grid-title {
      font-size: 1rem;
      font-weight: 700;
      color: #ffb5cb;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .numbers-board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
    }

    .board-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a0b1f;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .board-cell.selected {
      background: var(--gold);
      color: #120005;
      font-weight: 900;
      box-shadow: 0 0 8px rgba(245, 192, 66, 0.6);
    }

    .board-cell.last-drawn {
      background: var(--ruby) !important;
      color: #fff !important;
      animation: pulseCell 1s infinite alternate;
    }

    @keyframes pulseCell {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .history-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .history-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      background: #3b0e27;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid var(--ruby);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>RÉGIE BINGO DRAG</h1>
      <p style="font-size:0.85rem; color:#aaa;">Panneau de contrôle & transmission en direct</p>
    </header>

    <div class="controls-card">
      <!-- Section Musique / Playlist YouTube d'accueil -->
      <div class="yt-section">
        <div class="yt-title">
          <span>🎵 Ambiance d'accueil (Playlist / Vidéo YouTube)</span>
        </div>
        <div class="yt-row">
          <input type="text" id="yt-url-input" class="yt-input" placeholder="Collez l'URL de votre playlist ou vidéo YouTube...">
          <button id="btn-toggle-yt" class="btn-yt">🎬 Activer sur l'écran</button>
        </div>
      </div>

      <!-- Tirage du numéro -->
      <form id="add-form" class="input-row">
        <input type="number" id="manual-input" min="1" max="90" placeholder="N°" autofocus required>
        <button type="submit" class="btn-submit">Valider</button>
      </form>

      <div class="actions-grid">
        <button class="btn-undo" id="btn-undo">↩ Annuler le dernier numéro</button>
        <button class="btn-bingo" id="btn-bingo">✨ BINGO ! (Afficher 20s)</button>
        <button class="btn-reset" id="btn-reset">Effacer toute la sélection (Nouveau jeu)</button>
      </div>
    </div>

    <div class="history-card">
      <div class="grid-title">
        <span>Ordre de tirage (<span id="count-history">0</span> numéros)</span>
        <span id="last-drawn-text" style="color:var(--gold);">Dernier : Aucun</span>
      </div>
      <div class="history-tags" id="history-tags"></div>
    </div>

    <div class="grid-card">
      <div class="grid-title">
        <span>Tableau complet 1 à 90 (Cliquez pour marquer / démarquer)</span>
      </div>
      <div class="numbers-board" id="numbers-board"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCgEMnmlqYBJAKACie9cscUEEtizi1p4ow",
      authDomain: "bingodrag-d3823.firebaseapp.com",
      databaseURL: "https://bingodrag-d3823-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bingodrag-d3823",
      storageBucket: "bingodrag-d3823.firebasestorage.app",
      messagingSenderId: "561011306668",
      appId: "1:561011306668:web:e83e8682e0fe3e6173af09"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref("bingo_state");
    const localChannel = new BroadcastChannel("bingo_drag_bus");

    let state = {
      numbers: [],
      lastBingoAt: 0,
      showYoutube: false,
      youtubeUrl: ""
    };

    function syncState() {
      localStorage.setItem("bingo_drag_data", JSON.stringify(state));
      localChannel.postMessage(state);
      dbRef.set(state);
      renderAdmin();
    }

    dbRef.on("value", (snap) => {
      const val = snap.val();
      if (val) {
        state = val;
        if (!state.numbers) state.numbers = [];
        renderAdmin();
      }
    });

    function renderAdmin() {
      const nums = state.numbers || [];
      document.getElementById("count-history").textContent = nums.length;
      
      const last = nums[nums.length - 1];
      document.getElementById("last-drawn-text").textContent = last !== undefined ? `Dernier : ${last}` : "Dernier : Aucun";

      // Gestion bouton YouTube
      const btnYt = document.getElementById("btn-toggle-yt");
      const inputYt = document.getElementById("yt-url-input");
      if (state.youtubeUrl && !inputYt.value) {
        inputYt.value = state.youtubeUrl;
      }
      if (state.showYoutube) {
        btnYt.classList.add("active");
        btnYt.textContent = "⏹ Masquer la vidéo";
      } else {
        btnYt.classList.remove("active");
        btnYt.textContent = "🎬 Activer sur l'écran";
      }

      // Historique
      const tagsContainer = document.getElementById("history-tags");
      tagsContainer.innerHTML = "";
      nums.slice().reverse().forEach((n, idx) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = n;
        if (idx === 0) span.style.borderColor = "var(--gold)";
        tagsContainer.appendChild(span);
      });

      // Grille
      for (let i = 1; i <= 90; i++) {
        const cell = document.getElementById(`cell-${i}`);
        if (cell) {
          cell.className = "board-cell";
          if (nums.includes(i)) {
            cell.classList.add("selected");
            if (i === last) {
              cell.classList.add("last-drawn");
            }
          }
        }
      }
    }

    function buildBoard() {
      const board = document.getElementById("numbers-board");
      board.innerHTML = "";
      for (let i = 1; i <= 90; i++) {
        const cell = document.createElement("div");
        cell.id = `cell-${i}`;
        cell.className = "board-cell";
        cell.textContent = i;
        cell.addEventListener("click", () => toggleNumber(i));
        board.appendChild(cell);
      }
    }

    function addNumber(num) {
      if (num < 1 || num > 90 || isNaN(num)) return;
      if (!state.numbers.includes(num)) {
        state.numbers.push(num);
        // Si la vidéo était affichée, commencer le jeu la masque
        state.showYoutube = false;
        syncState();
      }
    }

    function toggleNumber(num) {
      if (state.numbers.includes(num)) {
        state.numbers = state.numbers.filter(n => n !== num);
      } else {
        state.numbers.push(num);
        state.showYoutube = false;
      }
      syncState();
    }

    // Toggle YouTube
    document.getElementById("btn-toggle-yt").addEventListener("click", () => {
      const url = document.getElementById("yt-url-input").value.trim();
      if (!url && !state.showYoutube) {
        alert("Veuillez coller un lien YouTube (playlist ou vidéo) d'abord !");
        return;
      }
      state.youtubeUrl = url;
      state.showYoutube = !state.showYoutube;
      syncState();
    });

    document.getElementById("add-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("manual-input");
      const val = parseInt(input.value, 10);
      if (val) {
        addNumber(val);
        input.value = "";
      }
    });

    document.getElementById("btn-undo").addEventListener("click", () => {
      if (state.numbers.length > 0) {
        state.numbers.pop();
        syncState();
      }
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("Voulez-vous vraiment effacer TOUS les numéros de la partie ?")) {
        state.numbers = [];
        state.lastBingoAt = 0;
        syncState();
      }
    });

    document.getElementById("btn-bingo").addEventListener("click", () => {
      state.lastBingoAt = Date.now();
      syncState();
    });

    buildBoard();
    const saved = localStorage.getItem("bingo_drag_data");
    if (saved) {
      try {
        state = JSON.parse(saved);
        if (!state.numbers) state.numbers = [];
      } catch(e){}
    }
    renderAdmin();
  </script>
</body>
</html>
